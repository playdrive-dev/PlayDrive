<?xml version="1.0" encoding="UTF-8"?>
<!-- PlayDrive 앱 아이콘 원본(108×108 adaptive icon 캔버스, 안전 영역 = 가운데 지름 66).
     배경: 밤 팔레트 깊은 남색 그라데이션 / 전경: 청록 메인 빛 + 바닥의 가는 빛 띠 두 줄(무드 화면 축소판). 글자 없음.
     Android 리소스: app/src/main/res/drawable/ic_launcher_background.xml, ic_launcher_foreground.xml -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22305A"/>
      <stop offset="0.6" stop-color="#121A33"/>
      <stop offset="1" stop-color="#070A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="54" cy="47" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAFFF9"/>
      <stop offset="0.18" stop-color="#B4EBE0"/>
      <stop offset="0.42" stop-color="#6CC3B5" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#6CC3B5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6CC3B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band1" x1="28" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD3C6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D6F6EF"/>
      <stop offset="1" stop-color="#8FD3C6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="34" y1="0" x2="74" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6CC3B5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FD3C6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6CC3B5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <circle cx="54" cy="47" r="27" fill="url(#glow)"/>
  <path d="M28,68.5 Q54,66.5 80,68.5" fill="none" stroke="url(#band1)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M34,74 Q54,72.6 74,74" fill="none" stroke="url(#band2)" stroke-width="1.4" stroke-linecap="round"/>
</svg>
